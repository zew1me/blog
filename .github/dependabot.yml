version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than this, so a compromised publish has time to be
    # caught and yanked first. pnpm's minimumReleaseAge enforces 5 days at install.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # astro check depends on an API TypeScript 7 removed; see AGENTS.md.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      quality-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
